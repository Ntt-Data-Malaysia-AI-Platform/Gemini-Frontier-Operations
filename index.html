<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gemini Use Case Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* VOICE work, shown to customers: polished, calm, premium
   IDEA liquid glass control room: frosted panes floating over slow-moving NTT DATA blue light
   PICTURE login: agent network around the Gemini core; home: impact/ease matrix; behind the scenes: 7-stage request route with live trace
   COLOUR deep night navy #040720 (light: ice #e8f0fb), NTT DATA blue #0072bc, cyan #00b4e6, coral for exceptions
   TYPE Inter Tight 700 display, Inter text, JetBrains Mono for traces only
   LAYOUT floating glass sidebar + content; workspace and trace split on laptop, stacked on phone */
:root{color-scheme:light dark;--base:light-dark(#e6eefa,#040720);--ink:light-dark(#0a1030,#eef2ff);--muted:light-dark(#46527a,#aab4d8);--glass:light-dark(rgba(255,255,255,.62),rgba(255,255,255,.085));--glass2:light-dark(rgba(255,255,255,.34),rgba(255,255,255,.025));--edge:light-dark(rgba(255,255,255,.9),rgba(255,255,255,.17));--line:light-dark(rgba(10,40,110,.12),rgba(255,255,255,.11));--hi:light-dark(rgba(255,255,255,1),rgba(255,255,255,.32));--shadow:light-dark(rgba(20,60,140,.2),rgba(0,0,0,.55));--blue:light-dark(#0062a8,#62c4ff);--cyan:#00b4e6;--logo:light-dark(#0072bc,#ffffff);--b1:light-dark(#8cc8f5,#0b22b0);--b2:light-dark(#b4ecfa,#0072bc);--b3:light-dark(#a9bdf7,#1530d8);--b4:light-dark(#d2f3ff,#00a2d4);--ok:light-dark(#0f7d55,#57e0a6);--warn:light-dark(#c03a26,#ff8a75);--chip:light-dark(rgba(0,114,188,.1),rgba(98,196,255,.13));--field:light-dark(rgba(255,255,255,.7),rgba(255,255,255,.06))}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
body.night{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--base);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow:hidden}
h1,h2,h3{font-family:"Inter Tight",Inter,sans-serif;letter-spacing:-.02em;line-height:1.08;margin:0;text-wrap:balance}
h1{font-size:clamp(30px,3.6vw,44px)}h2{font-size:21px}h3{font-size:16px}
p{margin:0 0 10px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
a{color:var(--blue)}
.liquid{position:fixed;inset:0;z-index:0;overflow:hidden;background:var(--base);pointer-events:none}
.liquid i{position:absolute;width:70vmax;height:70vmax;border-radius:50%;opacity:.9;animation:fl 28s ease-in-out infinite alternate}
.liquid i:nth-child(1){left:-22vmax;top:-26vmax;background:radial-gradient(circle,var(--b1) 0,transparent 62%)}
.liquid i:nth-child(2){right:-26vmax;top:-10vmax;background:radial-gradient(circle,var(--b2) 0,transparent 60%);animation-duration:34s;animation-delay:-8s}
.liquid i:nth-child(3){left:18vmax;bottom:-40vmax;background:radial-gradient(circle,var(--b3) 0,transparent 60%);animation-duration:40s;animation-delay:-14s}
.liquid i:nth-child(4){right:-10vmax;bottom:-30vmax;width:50vmax;height:50vmax;background:radial-gradient(circle,var(--b4) 0,transparent 60%);animation-duration:30s;animation-delay:-20s;opacity:.55}
@keyframes fl{0%{transform:translate(0,0) scale(1)}50%{transform:translate(6vmax,4vmax) scale(1.12)}100%{transform:translate(-4vmax,7vmax) scale(.94)}}
.glass{position:relative;background:linear-gradient(150deg,var(--glass),var(--glass2));-webkit-backdrop-filter:blur(26px) saturate(170%);backdrop-filter:blur(26px) saturate(170%);border:1px solid var(--edge);border-radius:20px;box-shadow:inset 0 1px 0 var(--hi),inset 1px 0 0 rgba(255,255,255,.06),0 12px 40px -14px var(--shadow)}
.hov{transition:transform .28s cubic-bezier(.2,.8,.2,1),box-shadow .28s,border-color .28s}
.hov::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(260px circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.3),transparent 62%);opacity:0;transition:opacity .28s}
.hov:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.55);box-shadow:inset 0 1px 0 var(--hi),0 22px 54px -16px var(--shadow),0 0 0 1px color-mix(in srgb,var(--cyan) 30%,transparent)}
.hov:hover::after{opacity:1}
.logo{display:block;fill:var(--logo);height:auto}
.btn{position:relative;min-height:44px;padding:0 20px;border-radius:999px;border:0;color:#fff;font-weight:600;background:linear-gradient(180deg,#38b4f5 0,#0a82cf 45%,#0062a8 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 -3px 8px rgba(0,30,80,.3),0 8px 20px -8px rgba(0,114,188,.8);transition:transform .2s,box-shadow .2s;white-space:nowrap}
.btn:hover{transform:translateY(-1px);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),inset 0 -3px 8px rgba(0,30,80,.3),0 10px 28px -6px rgba(0,180,230,.9)}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.ghost{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--edge);background:var(--field);font-weight:500;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:inset 0 1px 0 var(--hi);transition:border-color .2s,background .2s;white-space:nowrap}
.ghost:hover{border-color:var(--cyan)}
.ghost[aria-pressed=true]{color:var(--blue);border-color:var(--blue)}
.field{min-height:46px;padding:0 14px;border:1px solid var(--edge);border-radius:14px;background:var(--field);font-size:16px;width:100%;box-shadow:inset 0 1px 3px rgba(0,0,0,.08)}
.field:focus{border-color:var(--cyan);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--cyan) 25%,transparent)}
.muted{color:var(--muted)}.fine{font-size:13px;color:var(--muted)}.note{font-size:13px;color:var(--muted)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-weight:600;color:var(--muted);border-bottom:1px solid var(--line);padding:8px 10px;white-space:nowrap}
td{border-bottom:1px solid var(--line);padding:8px 10px;vertical-align:top}
td.n,th.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.fig{position:relative;min-height:340px}.fig>svg{position:absolute;inset:0;width:100%;height:100%}
/* login */
.login{position:relative;z-index:1;height:100%;overflow-y:auto;display:grid;grid-template-columns:minmax(320px,460px) minmax(0,1fr);gap:24px;padding:clamp(16px,3vw,40px)}
.lg-card{align-self:center;padding:clamp(24px,3vw,40px);display:grid;gap:18px;border-radius:28px}
.lg-card .logo{width:190px}
.lg-card h1{font-size:clamp(28px,3vw,38px)}
#lf{display:grid;gap:8px}
#lf label{font-weight:600;font-size:14px}
.pw{display:flex;gap:8px}
.err{min-height:20px;color:var(--warn);font-size:14px}
#lf .btn{margin-top:8px;width:100%}
.lg-fig{min-height:420px}
.lg-fig svg text{font:600 14px Inter,sans-serif;fill:var(--ink)}
/* app */
#app{position:relative;z-index:1;height:100%;display:grid;grid-template-columns:268px minmax(0,1fr)}
#app[hidden],.login[hidden]{display:none}
.side{margin:14px 0 14px 14px;padding:20px 12px;display:flex;flex-direction:column;gap:3px;overflow-y:auto;border-radius:24px}
.side .logo{width:132px;margin:2px 10px 4px}
.side .sub{font-size:13px;color:var(--muted);padding:0 10px 14px}
.side small{color:var(--muted);font-size:12px;font-weight:600;padding:14px 10px 4px}
.nav{display:flex;align-items:center;gap:10px;width:100%;min-height:42px;padding:0 12px;border:1px solid transparent;border-radius:14px;background:transparent;text-align:left;font-size:15px;transition:background .2s,border-color .2s}
.nav:hover{background:var(--chip)}
.nav[aria-current=page]{background:linear-gradient(150deg,var(--glass),var(--glass2));border-color:var(--edge);box-shadow:inset 0 1px 0 var(--hi),0 6px 18px -10px var(--shadow);font-weight:600}
.nav .dot{width:10px;height:10px;border-radius:4px;flex:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
.nav .ct{margin-left:auto;font-size:13px;color:var(--muted)}
main{overflow-y:auto;display:flex;flex-direction:column}
.top{position:sticky;top:12px;z-index:5;margin:14px max(2.4vw,14px) 0;display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:20px}
.srch{position:relative;flex:1;max-width:520px}
#res{position:absolute;top:52px;left:0;right:0;max-height:360px;overflow:auto;display:none;padding:6px;border-radius:16px}
#res button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:12px}
#res button:hover{background:var(--chip)}
.user{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:14px;white-space:nowrap}
.av{width:36px;height:36px;border-radius:50%;background:linear-gradient(160deg,#38b4f5,#0062a8);color:#fff;display:grid;place-items:center;font-weight:700;box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
#view{padding:clamp(20px,3vw,36px) max(2.4vw,14px) 48px;max-width:1340px;width:100%}
.head{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
.head p{max-width:64ch;margin-top:8px}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(9.5em,1fr));gap:12px;margin-bottom:22px}
.fg{padding:16px 18px}
.fg b{display:block;font:700 clamp(26px,3vw,34px) "Inter Tight",sans-serif;font-variant-numeric:tabular-nums}
.fg span{font-size:14px;color:var(--muted)}
.two{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:18px;margin-bottom:28px}
.card{padding:20px}
.mx{min-height:420px}
.mx svg text{font:13px Inter,sans-serif;fill:var(--muted)}
.mx svg .q{font:600 14px Inter,sans-serif;fill:var(--ink);opacity:.6}
.mx circle{cursor:pointer;stroke:rgba(255,255,255,.85);stroke-width:2;transition:r .2s}
.mx circle:hover,.mx circle:focus{r:12}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin-top:10px}
.legend span{display:flex;align-items:center;gap:6px}.legend i{width:10px;height:10px;border-radius:4px}
.rank{list-style:none;margin:0;padding:0}
.rank li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:10px 0;border-bottom:1px solid var(--line)}
.rank a{color:var(--ink);font-weight:600;text-decoration:none}.rank a:hover{color:var(--blue)}
.rank em{font-style:normal;font-size:13px;color:var(--muted);grid-column:1}
.rank b{grid-row:1/3;grid-column:2;align-self:center;font-variant-numeric:tabular-nums;color:var(--blue)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.fcard{display:flex;flex-direction:column;gap:9px;text-align:left;padding:20px;font-size:16px}
.fcard .hd{display:flex;align-items:center;gap:10px}
.fcard .hd i{width:12px;height:12px;border-radius:4px;background:var(--c);box-shadow:0 0 14px var(--c);flex:none}
.fcard p{font-size:14px;color:var(--muted);margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;padding:3px 10px;border-radius:999px;background:var(--chip);white-space:nowrap}
.meter{display:grid;grid-template-columns:4.5em minmax(0,1fr) 2.2em;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.meter i{height:6px;border-radius:3px;background:var(--line);position:relative;overflow:hidden}
.meter i::after{content:"";position:absolute;inset:0;width:var(--w);border-radius:3px;background:linear-gradient(90deg,color-mix(in srgb,var(--c) 60%,#fff),var(--c))}
.meter b{text-align:right;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.ucfoot{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:6px}
/* workspace */
.ws{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:18px;align-items:start}
.chat{display:flex;flex-direction:column;height:min(860px,82vh);min-height:480px;overflow:hidden;border-radius:24px}
.msgs{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:14px}
.m{max-width:100%;padding:12px 15px;border-radius:18px;font-size:15px}
.m.u{align-self:flex-end;max-width:82%;color:#fff;background:linear-gradient(160deg,#2ea6ee,#0062a8);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 8px 20px -10px rgba(0,114,188,.9);border-bottom-right-radius:6px}
.m.a{background:var(--field);border:1px solid var(--edge);box-shadow:inset 0 1px 0 var(--hi);border-bottom-left-radius:6px}
.m.a>*:last-child{margin-bottom:0}
.m.a h4{margin:12px 0 6px;font-size:15px}
.m.a ul,.m.a ol{margin:0 0 10px;padding-left:20px}
.m.a table{font-size:13px;margin-bottom:10px}
.who{font-size:13px;font-weight:600;color:var(--blue);margin-bottom:4px;display:flex;align-items:center;gap:6px}
.who::before{content:"";width:14px;height:14px;border-radius:50%;background:conic-gradient(#00b4e6,#0072bc,#9fe3fb,#00b4e6);box-shadow:0 0 10px #00b4e6}
.thinking{display:flex;gap:5px;padding:4px 0}.thinking i{width:7px;height:7px;border-radius:50%;background:var(--cyan);animation:b 1s infinite}
.thinking i:nth-child(2){animation-delay:.15s}.thinking i:nth-child(3){animation-delay:.3s}
@keyframes b{50%{opacity:.25;transform:translateY(-3px)}}
.sug{display:flex;flex-wrap:wrap;gap:8px;padding:12px 14px 0;border-top:1px solid var(--line)}
.sug button{text-align:left;font-size:14px;padding:8px 14px;min-height:40px;border:1px solid var(--edge);border-radius:14px;background:var(--field);transition:border-color .2s,transform .2s}
.sug button:hover{border-color:var(--cyan);transform:translateY(-1px)}
.ask{display:flex;gap:8px;padding:12px 14px 14px}
.side-p{display:grid;gap:14px}
.steps{list-style:none;margin:0;padding:0}
.steps li{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;padding:7px 0;font-size:14px;color:var(--muted)}
.steps li::before{content:"";width:18px;height:18px;margin-top:2px;border-radius:50%;border:2px solid var(--line)}
.steps li.run{color:var(--ink)}.steps li.run::before{border-color:var(--cyan);border-right-color:transparent;animation:sp .8s linear infinite}
.steps li.ok{color:var(--ink)}.steps li.ok::before{border-color:var(--ok);background:var(--ok);box-shadow:inset 0 0 0 3px var(--base)}
@keyframes sp{to{transform:rotate(360deg)}}
.kpi{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;font-size:14px}
.kpi b{text-align:right;white-space:nowrap}
.guard{font-size:14px;border-left:3px solid var(--ok);padding:4px 0 4px 12px}
.approve{margin-top:10px;padding:12px;border:1px dashed var(--cyan);border-radius:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:14px}
.approve span{flex:1 1 220px}
.tag{font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.t-ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.t-w{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.t-b{background:var(--chip);color:var(--blue)}
.bar{display:grid;grid-template-columns:minmax(0,12em) minmax(0,1fr) 3em;gap:10px;align-items:center;font-size:14px;margin:4px 0}
.bar i{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--cyan),var(--blue) var(--w),var(--line) var(--w))}
.bar b{text-align:right;font-variant-numeric:tabular-nums}
.crumb{font-size:14px;margin-bottom:10px}.crumb a{text-decoration:none}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px}
/* trace */
.trace{font:13px/1.5 "JetBrains Mono",ui-monospace,monospace;max-height:420px;overflow-y:auto;padding:4px 2px}
.trace.mini{max-height:230px;font-size:12px}
.ln{display:grid;grid-template-columns:4.4em 9.6em minmax(0,1fr);gap:8px;padding:3px 0;border-bottom:1px dashed var(--line);animation:in .3s ease-out}
.ln .ts{color:var(--muted);text-align:right}
.ln .ev{color:var(--cyan);font-weight:500}
.ln .ev.tl{color:var(--blue)}.ln .ev.gd{color:var(--ok)}.ln .ev.wn{color:var(--warn)}
.ln span:last-child{overflow-wrap:anywhere}
@keyframes in{from{opacity:0;transform:translateY(4px)}}
.trace.mini .ln{grid-template-columns:10.4em minmax(0,1fr)}.trace.mini .ts{display:none}
/* behind the scenes */
.ctrl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px;margin-bottom:18px;border-radius:22px}
.ctrl select{flex:1 1 260px;max-width:460px}
.route{position:relative;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:12px;padding:26px 16px 16px;margin-bottom:18px;border-radius:26px}
.track{position:absolute;left:calc(16px + (100% - 32px)/14);right:calc(16px + (100% - 32px)/14);top:12px;height:4px;border-radius:2px;background:var(--line)}
.track b{position:absolute;left:0;top:0;bottom:0;width:var(--p,0%);border-radius:2px;background:linear-gradient(90deg,var(--cyan),var(--blue));transition:width .6s ease;box-shadow:0 0 12px var(--cyan)}
.track i{position:absolute;top:-6px;left:var(--p,0%);width:16px;height:16px;margin-left:-8px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#00b4e6 55%,#0062a8);box-shadow:0 0 18px #00b4e6;transition:left .6s ease}
.stage{text-align:left;padding:14px 12px;border-radius:18px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.stage .sn{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--chip);color:var(--blue)}
.stage p{font-size:13px;color:var(--muted);margin:0}
.stage.on{border-color:var(--cyan);box-shadow:inset 0 1px 0 var(--hi),0 0 0 2px color-mix(in srgb,var(--cyan) 55%,transparent),0 0 34px -4px var(--cyan)}
.stage.on .sn{background:linear-gradient(160deg,#38b4f5,#0062a8);color:#fff;box-shadow:0 0 14px #00b4e6}
.stage.done .sn{background:color-mix(in srgb,var(--ok) 22%,transparent);color:var(--ok)}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{min-height:38px;padding:0 14px;border-radius:999px;border:1px solid transparent;background:transparent;font-weight:500;color:var(--muted)}
.tabs button[aria-selected=true]{border-color:var(--edge);background:var(--field);color:var(--ink);box-shadow:inset 0 1px 0 var(--hi)}
.ctx{font:13px/1.6 "JetBrains Mono",ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere;margin:0;max-height:420px;overflow-y:auto}
.ctx b{color:var(--cyan);font-weight:500}
.det h3{font-size:19px;margin-bottom:8px}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.flow{position:relative}
.fs{position:relative;display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:2px 12px;padding:8px 10px 14px 6px;border-radius:14px;opacity:.5;transition:opacity .35s,background .35s,box-shadow .35s}
.fs.on,.fs.done{opacity:1}
.fs.on{background:linear-gradient(90deg,color-mix(in srgb,var(--cyan) 18%,transparent),transparent 85%);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--cyan) 40%,transparent),0 0 24px -8px var(--cyan)}
.nd{position:relative;z-index:1;grid-row:1/3;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:600 12px Inter,sans-serif;background:var(--field);border:1px solid var(--edge);color:var(--muted);transition:background .3s,box-shadow .3s}
.fs.on .nd{color:#fff;border-color:transparent;background:radial-gradient(circle at 35% 30%,#d8f6ff,#00b4e6 45%,#0062a8);animation:pulse 1.3s ease-in-out infinite}
.fs.on .nd::before{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid transparent;border-top-color:var(--cyan);border-right-color:var(--cyan);animation:sp .9s linear infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 4px color-mix(in srgb,var(--cyan) 25%,transparent),0 0 18px #00b4e6}50%{box-shadow:0 0 0 9px color-mix(in srgb,var(--cyan) 6%,transparent),0 0 32px #00b4e6}}
.fs.done .nd{color:transparent;border-color:transparent;background:linear-gradient(160deg,color-mix(in srgb,var(--ok) 70%,#fff),var(--ok));box-shadow:0 0 14px -2px var(--ok)}
.fs.done .nd::after{content:"";position:absolute;width:10px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:translateY(-1px) rotate(-45deg)}
